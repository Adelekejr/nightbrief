# TEMPORARY — DELETE WITH THE REST OF THE PHASE 1 PROBE.
#
# Scoped to the probe branch on purpose: it never runs on main, never runs on a
# pull request, and touches nothing the real CI workflow covers.
#
# It exists because the machine that wrote the probe cannot reach Bitget or
# Vercel — an outbound allowlist refuses both — so there was no way to read a
# deployed probe's answer back. A runner can reach the endpoint and its logs
# are readable, which makes the tool names, the input schemas, the response
# shape and the timestamp question answerable now.
#
# What it does NOT answer is whether a Vercel function can reach the endpoint.
# A GitHub runner is a different network on different IPs. The preview route
# is still the verdict; this is the discovery pass that goes with it.
name: Bitget MCP probe (temporary)

on:
  push:
    branches: [feat/bitget-mcp-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: the probe has no dependencies, and installing the app's
      # tree here would only add ways for this job to fail for reasons that
      # are not the finding.
      - name: Probe agent.bitget.com/mcp
        run: node scripts/probe-bitget-mcp.mjs

      - name: Probe again, as JSON
        run: node scripts/probe-bitget-mcp.mjs --json
