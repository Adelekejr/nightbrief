<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#16130f" />
    <title>Nightbrief — after-hours research desk for tokenized US stocks</title>
    <meta
      name="description"
      content="Reconstruct what moved while the US market was closed, and which of your tokenized holdings it touches."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Absolute URLs, because a scraper resolves these against nothing. The
      image is a static file in the build output rather than a rendered page:
      nothing fetching it will execute the app to get one.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nightbrief" />
    <meta property="og:url" content="https://nightbrief.vercel.app/" />
    <meta
      property="og:title"
      content="Nightbrief — after-hours research desk for tokenized US stocks"
    />
    <meta
      property="og:description"
      content="What broke while New York was shut, and whether it reaches what you hold. Eight live sources, and every claim labelled fact, inference or gap."
    />
    <meta property="og:image" content="https://nightbrief.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Nightbrief: what broke while New York was shut, and whether it reaches what you hold."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Nightbrief — after-hours research desk for tokenized US stocks"
    />
    <meta
      name="twitter:description"
      content="What broke while New York was shut, and whether it reaches what you hold. Eight live sources, and every claim labelled fact, inference or gap."
    />
    <meta name="twitter:image" content="https://nightbrief.vercel.app/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
